apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache2
spec:
  replicas: 2

  selector:
    matchLabels:
      app: apache2

  template:
    metadata:
      labels:
        app: apache2

    spec:
      containers:
        - name: apache2
          image: httpd:2.4
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"