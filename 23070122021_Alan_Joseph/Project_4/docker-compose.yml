services:
  jenkins-master:
    build: ./jenkins
    container_name: jenkins-master
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

  agent1:
    build: ./agents
    container_name: slave1
    hostname: agent1
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${AGENT_PUBKEY}
    restart: unless-stopped

  agent2:
    build: ./agents
    container_name: slave2
    hostname: agent2
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${AGENT_PUBKEY}
    restart: unless-stopped

volumes:
  jenkins_home:
