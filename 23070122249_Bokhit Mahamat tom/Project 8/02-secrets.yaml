# -----------------------------------------------------------------------------
# IMPORTANT: This file uses `stringData` (plain text) purely so it's readable
# and editable here. Kubernetes encodes it to base64 in etcd automatically on
# apply. For real production use, DO NOT commit this file with real values to
# git — use `kubectl create secret`, a sealed-secrets/External Secrets
# controller, or your cloud provider's secret manager instead.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: shopease
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "shopease_admin"
  POSTGRES_PASSWORD: "ChangeMe_S3curePass!"
  POSTGRES_DB: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secret
  namespace: shopease
  labels:
    app: user-service
type: Opaque
stringData:
  DATABASE_URL: "postgresql://shopease_admin:ChangeMe_S3curePass!@postgres:5432/users_db"
  JWT_SECRET_KEY: "replace-with-a-long-random-jwt-signing-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secret
  namespace: shopease
  labels:
    app: product-service
type: Opaque
stringData:
  DATABASE_URL: "postgresql://shopease_admin:ChangeMe_S3curePass!@postgres:5432/products_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  namespace: shopease
  labels:
    app: order-service
type: Opaque
stringData:
  DATABASE_URL: "postgresql://shopease_admin:ChangeMe_S3curePass!@postgres:5432/orders_db"
  PAYMENT_GATEWAY_API_KEY: "replace-with-real-payment-gateway-key"
