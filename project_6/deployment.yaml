apiVersion: apps/v1
kind: Deployment
metadata:
  name: siddhantops-app
  labels:
    owner: ayush-siddhant
    prn: "23070122066"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: siddhantops-app
  template:
    metadata:
      labels:
        app: siddhantops-app
        owner: ayush-siddhant
    spec:
      containers:
        - name: siddhantops-app
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
