apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apache2
  template:
    metadata:
      labels:
        app: apache2
    spec:
      containers:
        - name: apache2
          image: httpd:2.4
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/local/apache2/htdocs
      volumes:
        - name: html
          configMap:
            name: apache2-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apache2-html
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>Apache2 on Kubernetes</title></head>
      <body>
        <h1>Apache2 running in a Kubernetes Deployment</h1>
        <p>PRN 23070122047 - Arsh Ansari</p>
      </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: apache2
spec:
  type: NodePort
  selector:
    app: apache2
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
