services:
  jenkins:
    build:
      context: ../Project1-Dockerized-Jenkins-Pipeline
      dockerfile: Dockerfile.jenkins
    image: devops-lab-jenkins:lts
    container_name: jenkins-master
    user: "0:0"
    hostname: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dorg.apache.commons.jelly.tags.fmt.timeZone=Asia/Kolkata"
      CASC_JENKINS_CONFIG: /var/jenkins_casc/jenkins.yaml
    group_add:
      - "0"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/casc.yaml:/var/jenkins_casc/jenkins.yaml:ro
      - ./jenkins/ssh/id_rsa:/run/secrets/agent_ssh_key:ro
    restart: unless-stopped

  slave-1:
    build:
      context: ./jenkins/agent
    image: devops-lab-maven-agent:jdk17
    container_name: jenkins-slave-1
    hostname: slave-1
    environment:
      JENKINS_AGENT_SSH_PUBKEY: "ssh-rsa  jenkins-agent-lab-key"
    restart: unless-stopped

  slave-2:
    image: devops-lab-maven-agent:jdk17
    container_name: jenkins-slave-2
    hostname: slave-2
    depends_on:
      - slave-1
    environment:
      JENKINS_AGENT_SSH_PUBKEY: "ssh-rsa  jenkins-agent-lab-key"
    restart: unless-stopped

volumes:
  jenkins_home:
