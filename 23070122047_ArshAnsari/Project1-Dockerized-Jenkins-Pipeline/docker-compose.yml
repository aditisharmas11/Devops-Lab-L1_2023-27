services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: devops-lab-jenkins:lts
    container_name: jenkins-server
    user: "0:0"
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dorg.apache.commons.jelly.tags.fmt.timeZone=Asia/Kolkata"
    group_add:
      - "0"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
