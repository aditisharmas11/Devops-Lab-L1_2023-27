apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-feed
  labels:
    app: social-feed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-feed
  template:
    metadata:
      labels:
        app: social-feed
    spec:
      containers:
        - name: social-feed
          image: social-feed:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: social-feed
spec:
  type: NodePort
  selector:
    app: social-feed
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: social-feed
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: social-feed
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
